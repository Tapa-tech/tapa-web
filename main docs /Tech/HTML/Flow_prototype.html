<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Tapa Co. — Flow Prototype</title>
<style>
:root{
  --bg:#F2EDE4; --card:#FFFFFF; --dark:#1C1712; --pink:#D4175A;
  --amber:#E8A020; --amber-light:#FFF8E8; --amber-border:#E8D8A0; --amber-text:#8B6914;
  --gold:#E3B567; --body:#2C2010; --mid:#5C4B12; --sub:#8A7A68; --border:#E8E0D0;
  --white:#FFFDF5; --dim:#7A6A55; --dimmer:#5C4E36;
  --gbg:#EBF5EC; --gtx:#1A5C28; --gbd:#C5DFB8;
  --rbg:#FEF0F4; --rmd:#5C1A30;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#DCD3C4;color:var(--body);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}button{font-family:inherit;cursor:pointer}

/* ══ APP CHROME ══ */
.head{background:var(--dark);padding:22px 30px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100}
.head img{height:34px;width:auto}
.head-t{font-size:17px;font-weight:700;color:var(--white)}
.head-s{font-size:11.5px;color:var(--dim);margin-top:1px}
.head-r{margin-left:auto;display:flex;gap:8px;align-items:center}
.hchip{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:8px;padding:6px 12px;font-size:10.5px;color:var(--gold);font-weight:600}

.layout{display:grid;grid-template-columns:262px 1fr;min-height:calc(100vh - 78px)}
.rail{background:var(--card);border-right:1px solid #C4B8A4;padding:20px 0 40px;position:sticky;top:78px;align-self:start;max-height:calc(100vh - 78px);overflow-y:auto}
.rgrp{margin-bottom:20px}
.rgrp-h{font-size:9.5px;font-weight:700;letter-spacing:.7px;padding:0 20px 8px;color:var(--pink)}
.rgrp-h span{display:block;font-size:10px;font-weight:400;color:var(--sub);letter-spacing:0;margin-top:3px;line-height:1.5;text-transform:none}
.rgrp.edge .rgrp-h{color:var(--amber-text)}
.ritem{display:flex;align-items:center;gap:10px;padding:9px 20px;font-size:12.5px;color:var(--body);border-left:3px solid transparent;cursor:pointer}
.ritem:hover{background:var(--bg)}
.ritem.on{background:var(--rbg);border-left-color:var(--pink);color:var(--pink);font-weight:700}
.ritem-n{font-size:9.5px;color:var(--sub);min-width:16px}
.ritem.on .ritem-n{color:var(--pink)}

.stage{padding:34px 40px 60px;display:grid;grid-template-columns:400px 1fr;gap:38px;align-items:start}
.phone{width:390px;background:var(--bg);border-radius:22px;overflow:hidden;border:1px solid #C4B8A4;box-shadow:0 10px 34px rgba(28,23,18,.16)}
.notes{position:sticky;top:112px}
.n-ey{font-size:9.5px;font-weight:700;color:var(--pink);letter-spacing:.7px;margin-bottom:7px}
.n-t{font-size:24px;font-weight:700;color:var(--dark);letter-spacing:-.4px;margin-bottom:9px;line-height:1.25}
.n-s{font-size:14px;color:var(--sub);line-height:1.78;margin-bottom:18px}
.ncard{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:16px 19px;margin-bottom:11px}
.nc-h{font-size:9.5px;font-weight:700;letter-spacing:.6px;margin-bottom:9px;color:var(--amber-text)}
.ncard ul{list-style:none}
.ncard li{font-size:12.5px;line-height:1.68;padding:4px 0 4px 15px;position:relative;color:var(--body)}
.ncard li::before{content:'·';position:absolute;left:3px;color:var(--pink);font-weight:700;font-size:16px;line-height:1.1}
.ncard.warn{background:var(--rbg);border-color:#F0B8CC}
.ncard.warn .nc-h{color:var(--pink)}
.ncard.rule{background:var(--dark);border-color:var(--dark)}
.ncard.rule .nc-h{color:var(--gold)}
.ncard.rule li{color:#C4A882}
.ncard.rule li::before{color:var(--amber)}
.ncard.rule b{color:var(--amber)}
.nextrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.nextbtn{background:var(--dark);border:none;border-radius:9px;padding:9px 15px;font-size:11.5px;font-weight:600;color:#fff}
.nextbtn.alt{background:var(--card);border:1.5px solid var(--border);color:var(--body)}

/* ══ SCREEN SHELL ══ */
.scr{display:none}
.scr.on{display:block}
.sann{background:var(--dark);padding:6px 14px;text-align:center}
.sann p{font-size:9px;color:var(--gold)}
.sann strong{color:var(--pink);font-weight:600}
.snav{background:var(--card);border-bottom:1px solid var(--border);height:52px;display:flex;align-items:center;padding:0 12px;gap:8px}
.sbg{width:30px;display:flex;flex-direction:column;gap:4px;padding:0 6px}
.sbg span{height:2px;background:var(--dark);border-radius:2px}
.sbg span:nth-child(2){width:68%}
.slogo{display:flex;align-items:center;gap:5px;margin-right:auto}
.slogo img{height:28px;width:auto;display:block}
.slogo span{font-size:7px;color:var(--pink);font-weight:600;line-height:1.15;max-width:46px}
.sic{width:30px;height:30px;border:1.5px solid var(--border);border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;position:relative}
.sic.cart::after{content:attr(data-n);position:absolute;top:-5px;right:-5px;background:var(--pink);color:#fff;font-size:8px;font-weight:700;width:15px;height:15px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--card)}
.sback{background:var(--card);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:600;color:var(--body)}
.sbody{padding:16px 14px 20px;min-height:300px}
.sfoot{background:var(--dark);padding:14px;text-align:center}
.sfoot p{font-size:9px;color:var(--dimmer);line-height:1.6}

/* generic bits */
.h1{font-size:22px;font-weight:700;color:var(--dark);line-height:1.25;letter-spacing:-.3px;margin-bottom:8px}
.h2{font-size:16px;font-weight:700;color:var(--dark);margin:18px 0 9px}
.p{font-size:13px;line-height:1.75;margin-bottom:11px}
.mut{color:var(--sub);font-size:12px;line-height:1.65}
.pill{font-size:9.5px;padding:3px 9px;border-radius:5px;font-weight:700;display:inline-block}
.pill.d{background:var(--gbg);color:var(--gtx);border:1px solid var(--gbd)}
.pill.a{background:var(--amber-light);color:var(--amber-text);border:1px solid var(--amber-border)}
.pill.p{background:var(--rbg);color:var(--pink);border:1px solid #F0B8CC}
.btn{width:100%;background:var(--pink);border:none;border-radius:11px;padding:13px;font-size:13.5px;font-weight:700;color:#fff;display:block;text-align:center}
.btn.g{background:var(--card);border:1.5px solid var(--border);color:var(--body)}
.btn.dk{background:var(--dark)}
.btn.dis{background:#D8CDB8;color:#8A7A68}
.card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:14px 16px;margin-bottom:11px}
.row{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;font-size:12.5px;gap:12px}
.row b{font-weight:700;color:var(--dark)}
.hr{height:1px;background:var(--border);margin:11px 0}
.field{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--sub);margin-bottom:9px}
.field.f{color:var(--dark);font-weight:600}
.lab{font-size:9.5px;font-weight:700;color:var(--amber-text);letter-spacing:.5px;margin-bottom:5px}
.cut{background:var(--amber-light);border:1px solid var(--amber-border);border-radius:10px;padding:11px 13px;font-size:12px;line-height:1.65;margin-bottom:12px}
.cut b{color:var(--amber-text)}
.sticky{background:var(--card);border-top:1px solid var(--border);padding:11px 14px;display:flex;gap:9px;align-items:center}
.st-p{font-size:16px;font-weight:700;color:var(--dark)}
.st-s{font-size:9.5px;color:var(--sub)}
.st-b{margin-left:auto;background:var(--pink);border:none;border-radius:10px;padding:12px 20px;font-size:13px;font-weight:700;color:#fff}
.hero-k{height:150px;display:flex;align-items:flex-start;justify-content:space-between;padding:12px 14px;border-radius:13px;margin-bottom:13px}
.k-gan{background:linear-gradient(150deg,#6B3410,#B5651D)}
.k-shiva{background:linear-gradient(150deg,#151033,#2E2260)}
.badge{font-size:9px;font-weight:700;letter-spacing:.4px;padding:3px 8px;border-radius:5px;background:var(--pink);color:#fff}
.badge.n{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.3)}
.badge.dk{background:rgba(0,0,0,.34);color:#fff}
.succ{text-align:center;padding:26px 6px 6px}
.succ-i{width:64px;height:64px;border-radius:50%;background:var(--gbg);border:2px solid var(--gbd);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 15px}
.succ-i.warn{background:var(--rbg);border-color:#F0B8CC}
.succ-t{font-size:21px;font-weight:700;color:var(--dark);margin-bottom:7px;line-height:1.3}
.succ-s{font-size:13px;color:var(--sub);line-height:1.72;margin-bottom:18px}
.tl{position:relative;padding-left:22px}
.tl-i{position:relative;padding-bottom:16px}
.tl-i::before{content:'';position:absolute;left:-22px;top:4px;width:11px;height:11px;border-radius:50%;background:var(--border);border:2px solid var(--card)}
.tl-i.done::before{background:var(--gtx)}
.tl-i.now::before{background:var(--pink);box-shadow:0 0 0 3px rgba(212,23,90,.18)}
.tl-i::after{content:'';position:absolute;left:-17.5px;top:15px;bottom:0;width:2px;background:var(--border)}
.tl-i:last-child::after{display:none}
.tl-t{font-size:13px;font-weight:700;color:var(--dark)}
.tl-s{font-size:11.5px;color:var(--sub);margin-top:2px;line-height:1.6}
.otpb{display:flex;gap:7px;margin-bottom:12px}
.otpb div{flex:1;height:44px;border:1.5px solid var(--border);border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:var(--dark)}
.otpb div.e{color:var(--sub)}
.tile{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px;text-align:center}
.tile-n{font-size:20px;font-weight:700;color:var(--dark)}
.tile-l{font-size:10px;color:var(--sub);margin-top:2px}
.arow{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:.5px solid var(--border);font-size:13px}
.arow:last-child{border-bottom:none}
.arow span:last-child{margin-left:auto;color:var(--sub);font-size:15px}
.ci{display:flex;gap:11px;padding:12px 0;border-bottom:.5px solid var(--border)}
.ci:last-child{border-bottom:none}
.ci-th{width:56px;height:56px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px}
.ci-n{font-size:13px;font-weight:700;color:var(--dark);line-height:1.3}
.ci-s{font-size:11px;color:var(--sub);margin-top:2px;line-height:1.55}
.ci-p{font-size:13.5px;font-weight:700;color:var(--dark);margin-top:5px}
.qty{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:4px 9px;margin-top:6px;width:fit-content;font-size:12px}
.qty b{font-weight:700}
.pay{display:flex;align-items:center;gap:11px;padding:12px 13px;border:1.5px solid var(--border);border-radius:11px;margin-bottom:9px;background:var(--card)}
.pay.on{border-color:var(--pink);background:var(--rbg)}
.pay.off{opacity:.5}
.pay-r{width:17px;height:17px;border-radius:50%;border:2px solid var(--border);flex-shrink:0}
.pay.on .pay-r{border-color:var(--pink);background:radial-gradient(circle,var(--pink) 45%,transparent 47%)}
.pay-t{font-size:13px;font-weight:600;color:var(--dark)}
.pay-s{font-size:11px;color:var(--sub);margin-top:1px}
.srch{background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:10px 14px;font-size:12.5px;color:var(--sub);margin-bottom:14px;display:flex;gap:8px}
.sres{padding:12px 0;border-bottom:.5px solid var(--border)}
.sres-k{font-size:9px;font-weight:700;color:var(--amber-text);letter-spacing:.5px;margin-bottom:4px}
.sres-t{font-size:14px;font-weight:700;color:var(--dark);line-height:1.3}
.sres-s{font-size:11.5px;color:var(--sub);margin-top:3px;line-height:1.6}
</style>
</head>

/* ═══ RENDER ═══ */
const GROUPS=[
 ['Reader','Anonymous. Never signs in. Most of your traffic.',['home','article','search']],
 ['Saver','Wants to come back. First account moment.',['save','account']],
 ['Pre-booker','Dated kit. Full prepayment, no COD.',['pdp','cart','address','payment','prebooked']],
 ['Buyer','All-year kit. Standard e-commerce. COD allowed.',['pdpyear','ordered']],
 ['Returning','Checks status. Reorders.',['track','orders']],
 ['Edge','Where trust is actually won or lost.',['cutoff','pincode','payfail','emptycart','soldout','delay']]
];

let cur='home';
function rail(){
 let h='';let n=0;
 GROUPS.forEach(([g,d,keys])=>{
   h+=`<div class="rgrp${g==='Edge'?' edge':''}"><div class="rgrp-h">${g.toUpperCase()}<span>${d}</span></div>`;
   keys.forEach(k=>{n++;h+=`<div class="ritem${k===cur?' on':''}" onclick="go('${k}')"><span class="ritem-n">${String(n).padStart(2,'0')}</span>${S[k].t}</div>`});
   h+='</div>';
 });
 document.getElementById('rail').innerHTML=h;
}
function go(k){
 cur=k;const s=S[k];
 document.getElementById('phone').innerHTML=`<div class="scr on">${s.body}</div>`;
 let n=`<div class="n-ey">${s.ey}</div><div class="n-t">${s.title}</div><p class="n-s">${s.sub}</p>`;
 s.notes.forEach(([h,items])=>{
   const cls=h==='WARN'?'warn':(h==='RULE'?'rule':'');
   n+=`<div class="ncard ${cls}"><div class="nc-h">${h}</div><ul>${items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`;
 });
 if(s.next&&s.next.length){
   n+=`<div class="nextrow">${s.next.map((x,i)=>`<button class="nextbtn${i?' alt':''}" onclick="go('${x}')">${S[x].t} ›</button>`).join('')}</div>`;
 }
 document.getElementById('notes').innerHTML=n;
 rail();
 window.scrollTo({top:0,behavior:'smooth'});
}
go('home');
</script>
